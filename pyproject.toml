[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webmcp-bridge"
version = "0.1.0"
description = "Expose Browser Buddy's logged-in-browser tools as WebMCP-callable endpoints (stdlib only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hao li" }]
keywords = ["webmcp", "mcp", "chrome", "browser", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/webmcp-bridge"
Repository = "https://github.com/hahahahahahahahah6/webmcp-bridge"

[project.scripts]
webmcp-bridge = "webmcp_bridge.bridge:main"

[tool.setuptools.packages.find]
include = ["webmcp_bridge*"]

[tool.setuptools.package-data]
webmcp_bridge = ["webmcp.js", "demo.html"]
